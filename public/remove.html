<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove a Wish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="form-body">
    <div class="glass-card form-container">
        <h1>Remove Wish</h1>
        <p>Enter the exact text to remove</p>
        <form id="removeForm">
            <input type="text" id="removeInput" placeholder="I wanna be a Super Man" required autocomplete="off">
            <button type="submit" class="glow-btn" style="background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);">Remove</button>
        </form>
        <div id="successMessage" class="hidden">Wish removed!</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="remove.min.js"></script>
</body>

</html>
