<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Wish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="form-body">
    <div class="glass-card form-container">
        <h1>Welcome</h1>
        <p>What is Your Wish?</p>
        <form id="wishForm">
            <input type="text" id="wishInput" placeholder="I wanna be a Super Man" required autocomplete="off">
            <button type="submit" class="glow-btn">Submit</button>
        </form>
        <div id="successMessage" class="hidden">May Your Wish Come True!</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="form.min.js"></script>
</body>

</html>
